<!-- templates/admin/login.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Королевские Жалюзи</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap');
        
        .royal-font {
            font-family: 'Cormorant Garamond', serif;
        }
        
        .royal-gradient {
            background: linear-gradient(135deg, #C5A059 0%, #E5C687 50%, #C5A059 100%);
        }
        
        .royal-text {
            background: linear-gradient(135deg, #C5A059, #E5C687);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .royal-glass {
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            box-shadow: 0 8px 32px 0 rgba(197, 160, 89, 0.2);
        }
        
        @keyframes crownGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.5)); }
            50% { filter: drop-shadow(0 0 30px rgba(197, 160, 89, 0.8)); }
        }
        
        .crown-animation {
            animation: crownGlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
    
    <div class="fixed inset-0 opacity-20">
        <div class="absolute inset-0" style="background-image: url('https://images.unsplash.com/photo-1583847268964-b28dc8aaec9f?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80'); background-size: cover; background-position: center;"></div>
    </div>
    
    <div class="royal-glass rounded-2xl p-8 max-w-md w-full relative z-10" data-aos="fade-up">
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <i class="fas fa-crown text-5xl royal-text crown-animation"></i>
            </div>
            <h1 class="text-3xl royal-font font-bold mb-2">
                <span class="royal-text">Королевский</span>
                <span class="text-white"> вход</span>
            </h1>
            <p class="text-gray-400">Войдите в админ-панель</p>
        </div>
        
        {% if error %}
        <div class="bg-red-500 bg-opacity-20 border border-red-500 text-red-500 px-4 py-3 rounded-lg mb-6">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="post" class="space-y-6">
            <div>
                <label class="block text-gray-300 mb-2 text-sm">Логин</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-[#C5A059]"></i>
                    <input type="text" name="username" required 
                           class="w-full bg-black bg-opacity-50 border border-gray-700 rounded-lg pl-10 pr-4 py-3 text-white focus:outline-none focus:border-[#C5A059] transition"
                           placeholder="Введите логин">
                </div>
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2 text-sm">Пароль</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-[#C5A059]"></i>
                    <input type="password" name="password" required 
                           class="w-full bg-black bg-opacity-50 border border-gray-700 rounded-lg pl-10 pr-4 py-3 text-white focus:outline-none focus:border-[#C5A059] transition"
                           placeholder="Введите пароль">
                </div>
            </div>
            
            <button type="submit" 
                    class="w-full royal-gradient text-black py-3 rounded-lg font-semibold hover:shadow-2xl transform hover:scale-105 transition duration-300">
                Войти в панель управления
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-500 text-sm"></p>
            <a href="/" class="text-[#C5A059] hover:text-[#E5C687] text-sm block mt-4">
                <i class="fas fa-arrow-left mr-2"></i>Вернуться на сайт
            </a>
        </div>
    </div>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 1000
        });
    </script>
</body>
</html>
